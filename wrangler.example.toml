name = "our-little-bakery"
compatibility_date = "2026-10-01"
pages_build_output_dir = "public"

# D1 — create with: wrangler d1 create our-little-bakery  (paste the database_id below)
[[d1_databases]]
binding = "DB"
database_name = "our-little-bakery"
database_id = "REPLACE_WITH_DATABASE_ID"

# KV for the per-IP rate limit — create with: wrangler kv namespace create RATE
[[kv_namespaces]]
binding = "RATE"
id = "REPLACE_WITH_KV_ID"

# Secrets (never in this file):
#   wrangler pages secret put ADMIN_TOKEN     -> long random string for /admin
#   wrangler pages secret put NOTIFY_WEBHOOK  -> optional, URL that forwards new orders to WhatsApp/SMS
